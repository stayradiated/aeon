name: Test Coverage

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    name: Test Coverage
    timeout-minutes: 5
    runs-on: ubuntu-latest

    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aeon
      ROOT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/template1

    services:
      postgres:
        image: postgres:18.1-trixie
        env:
          POSTGRES_DB: aeon
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - # https://github.com/actions/checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        # https://github.com/extractions/setup-crate
      - name: Install just
        uses: extractions/setup-crate@7577c1bdf2d95e6d65d532788f35ed79d4b1dda2 # v2.0.1
        with:
          owner: casey
          name: just
          version: "1.42.4"

      - # https://github.com/pnpm/action-setup
        name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - # https://github.com/actions/setup-node
        name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrations
        run: just db reset

      - name: Svelte
        run: just svelte-sync

      - name: Vitest
        run: just test-coverage

      - name: Report Coverage
        # Set `if: always()` to also generate the report if tests are failing
        if: always()
        # https://github.com/davelosert/vitest-coverage-report-action
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
